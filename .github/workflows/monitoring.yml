name: Monitoring (exporters)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ansible/roles/node_exporter/**'
      - 'ansible/playbooks/monitoring.yml'
      - '.github/workflows/monitoring.yml'

permissions:
  contents: read

jobs:
  exporters:
    name: node_exporter sur les VMs
    runs-on: [self-hosted, lab]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Préparer le mot de passe Vault
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$RUNNER_TEMP/.vault_pass"
          chmod 600 "$RUNNER_TEMP/.vault_pass"
      - name: Déployer node_exporter
        run: |
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/monitoring.yml \
            --vault-password-file "$RUNNER_TEMP/.vault_pass"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
      - if: always()
        run: rm -f "$RUNNER_TEMP/.vault_pass"
