name: Reusable Node CI
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: true
      node-version:
        type: string
        default: '20'
      upload-artifact:
        type: boolean
        default: false
      artifact-name:
        type: string
        default: project
      node-versions:
        type: string
        default: '["20"]'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - name: ESLint
        working-directory: ${{ inputs.working-directory }}
        run: npm run lint
      - name: Prettier
        working-directory: ${{ inputs.working-directory }}
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ matrix.node }}
      - name: Tests + rapport JUnit + couverture
        working-directory: ${{ inputs.working-directory }}
        run: npm run test:ci
      - name: Publier le rapport de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests ${{ inputs.artifact-name }} (Node ${{ matrix.node }})
          path: ${{ inputs.working-directory }}/reports/junit.xml
          reporter: java-junit
      - name: Résumé de couverture
        if: always()
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "## Couverture — ${{ inputs.artifact-name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk -F: '/^LH:/{h+=$2} /^LF:/{f+=$2} END{printf "Lignes couvertes : %d/%d\n", h, f}' coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Archiver la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.artifact-name }}-${{ matrix.node }}
          path: ${{ inputs.working-directory }}/coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: npm run build
      - name: Archiver le build
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 7

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (vulnérabilités high/critical)
        working-directory: ${{ inputs.working-directory }}
        run: npm audit --audit-level=high || true
