name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: Front
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      working-directory: .
      upload-artifact: true
      artifact-name: front
      node-versions: '["20", "22"]'

  api:
    name: API
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      working-directory: api
      artifact-name: api
