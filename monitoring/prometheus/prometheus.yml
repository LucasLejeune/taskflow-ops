global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-local
    static_configs:
      - targets: ['node-exporter:9100']
        labels: { env: lab }

  - job_name: taskflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.64.11:80']
        labels: { env: staging }
      - targets: ['192.168.64.12:80']
        labels: { env: prod }

  - job_name: node-vms
    static_configs:
      - targets: ['192.168.64.11:9100']
        labels: { env: staging }
      - targets: ['192.168.64.12:9100']
        labels: { env: prod }
