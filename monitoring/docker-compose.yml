services:
  prometheus:
    image: docker.io/prom/prometheus:v2.53.0
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [monitoring]

  grafana:
    image: docker.io/grafana/grafana:11.1.0
    container_name: grafana
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring]

  node-exporter:
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: node-exporter
    ports: ["9100:9100"]
    command: ['--path.rootfs=/host']
    volumes: ['/:/host:ro,rslave']
    networks: [monitoring]

  alertmanager:
    image: docker.io/prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports: ["8081:8080"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  blackbox-exporter:
    image: docker.io/prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    ports: ["9115:9115"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [monitoring]

  mailhog:
    image: docker.io/mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports: ["8025:8025", "1025:1025"]
    networks: [monitoring]

  loki:
    image: docker.io/grafana/loki:3.1.0
    container_name: loki
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml
    networks: [monitoring]

  promtail:
    image: docker.io/grafana/promtail:3.1.0
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [monitoring]

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  monitoring:
